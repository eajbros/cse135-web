name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 138.68.56.108
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/hknucsd-outreach.org/public_html
            git pull origin main

            REPORTING_DIR="/var/www/hknucsd-outreach.org/public_html/cse135-web/reporting.hknucsd-outreach.org"

            if [ -f "$REPORTING_DIR/composer.json" ]; then
              cd "$REPORTING_DIR"
              composer install --no-interaction --no-dev --prefer-dist --optimize-autoloader
              composer clear-cache
            fi

            sudo systemctl reload apache2

